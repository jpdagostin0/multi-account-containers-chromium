<html>
<head>
  <meta charset="utf-8">
  <title>History by container</title>
  <link rel="stylesheet" href="css/newtab.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div class="layout">
    <nav id="filters" aria-label="Containers"></nav>
    <main>
      <header>
        <h1>History</h1>
        <input id="q" type="search" placeholder="Search history" autocomplete="off" spellcheck="false">
        <button id="clear" class="danger"></button>
      </header>
      <div id="list"></div>
      <button id="more" hidden>Show more</button>
      <p id="empty" class="empty" hidden>No history here yet.</p>
    </main>
  </div>
  <template id="row-tpl">
    <div class="row">
      <time></time>
      <span class="favicon"></span>
      <a class="text"><span class="title"></span><span class="host"></span></a>
      <span class="badge"></span>
      <button class="del" title="Remove from history">×</button>
    </div>
  </template>
  <script type="module" src="js/chrome/history-page.js"></script>
</body>
</html>
