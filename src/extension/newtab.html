<html>
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/newtab.css">
  <link rel="stylesheet" href="css/history-rows.css">
</head>
<body>
  <nav id="container-tabs" aria-label="Switch this tab's container"></nav>
  <button id="history-toggle" type="button" aria-controls="history-drawer" aria-expanded="false"><span class="clock"></span>History</button>
  <main>
    <form id="search">
      <input id="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false">
      <ul id="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
    </form>
    <div id="sections"></div>
  </main>
  <aside id="history-drawer" aria-label="History">
    <div class="drawer-head">
      <a class="full-history" href="history.html" title="Open the full history page">All history</a>
      <button class="close" type="button" title="Close">×</button>
    </div>
    <div class="drawer-body">
      <div class="list"></div>
      <p class="empty" hidden>No history here yet.</p>
      <div class="sentinel"></div>
    </div>
  </aside>
  <template id="section-tpl">
    <section class="container-section">
      <h2><span class="ident-icon"></span><span class="name"></span><span class="here">this tab</span></h2>
      <ol class="tiles"></ol>
      <p class="empty"></p>
    </section>
  </template>
  <template id="tile-tpl">
    <li class="tile">
      <a>
        <span class="favicon"></span>
        <span class="text"><span class="title"></span><span class="host"></span></span>
      </a>
      <button class="hide" title="Remove from this list">×</button>
    </li>
  </template>
  <template id="row-tpl">
    <div class="row">
      <time></time>
      <span class="favicon"></span>
      <a class="text"><span class="title"></span><span class="host"></span></a>
      <span class="badge"></span>
      <button class="del" title="Remove from history">×</button>
    </div>
  </template>
  <script type="module" src="js/chrome/newtab.js"></script>
</body>
</html>
